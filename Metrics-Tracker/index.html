<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC Metrics Tracker - Track & Generate Case Studies</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-tertiary: #1a1a24;
            --accent-primary: #00ff88;
            --accent-secondary: #ff0080;
            --accent-tertiary: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #606078;
            --border-color: #2a2a38;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4466;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 0, 128, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, 5%) rotate(120deg); }
            66% { transform: translate(-5%, 5%) rotate(240deg); }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            animation: fadeIn 0.8s ease 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .tab-button:hover {
            color: var(--text-primary);
        }

        .tab-button.active {
            color: var(--accent-primary);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-tertiary));
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.15);
            transform: translateY(-2px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.875rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            border: none;
            border-radius: 8px;
            padding: 1rem 2rem;
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff6688);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 24px rgba(255, 68, 102, 0.4);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.15);
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .campaign-list {
            display: grid;
            gap: 1.5rem;
        }

        .campaign-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .campaign-item:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 4px 16px rgba(0, 255, 136, 0.2);
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .campaign-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .campaign-brand {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .campaign-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .icon-btn:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: scale(1.1);
        }

        .campaign-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .campaign-metric {
            display: flex;
            flex-direction: column;
        }

        .campaign-metric-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .campaign-metric-value {
            color: var(--text-primary);
            font-size: 1.125rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }

        .video-preview {
            background: var(--bg-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .video-canvas {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0, 255, 136, 0.2);
        }

        .video-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-tertiary));
        }

        .stat-title {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Space Mono', monospace;
            color: var(--text-primary);
        }

        .stat-trend {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--success);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: var(--accent-primary);
            transform: rotate(90deg);
        }

        .insight-box {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--accent-primary);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .insight-title {
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .insight-text {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .content {
                padding: 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                overflow-x: auto;
                white-space: nowrap;
            }

            .tab-button {
                padding: 0.875rem 1rem;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-primary);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.3);
            animation: slideUp 0.3s ease;
            z-index: 2000;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [campaigns, setCampaigns] = useState([]);
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingCampaign, setEditingCampaign] = useState(null);
            const [toast, setToast] = useState(null);

            // Load campaigns from localStorage
            useEffect(() => {
                const saved = localStorage.getItem('ugc-campaigns');
                if (saved) {
                    setCampaigns(JSON.parse(saved));
                }
            }, []);

            // Save campaigns to localStorage
            useEffect(() => {
                if (campaigns.length > 0) {
                    localStorage.setItem('ugc-campaigns', JSON.stringify(campaigns));
                }
            }, [campaigns]);

            const addCampaign = (campaign) => {
                const newCampaign = {
                    ...campaign,
                    id: Date.now(),
                    createdAt: new Date().toISOString()
                };
                setCampaigns([...campaigns, newCampaign]);
                showToast('Campaign added successfully!');
            };

            const updateCampaign = (updatedCampaign) => {
                setCampaigns(campaigns.map(c => 
                    c.id === updatedCampaign.id ? updatedCampaign : c
                ));
                showToast('Campaign updated successfully!');
            };

            const deleteCampaign = (id) => {
                setCampaigns(campaigns.filter(c => c.id !== id));
                showToast('Campaign deleted');
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            return (
                <div className="app-container">
                    <div className="bg-grid"></div>
                    <div className="bg-gradient"></div>
                    
                    <div className="content">
                        <header>
                            <div className="logo">UGC METRICS</div>
                            <div className="tagline">Track • Analyze • Generate</div>
                        </header>

                        <nav className="nav-tabs">
                            <button 
                                className={`tab-button ${activeTab === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setActiveTab('dashboard')}
                            >
                                Dashboard
                            </button>
                            <button 
                                className={`tab-button ${activeTab === 'campaigns' ? 'active' : ''}`}
                                onClick={() => setActiveTab('campaigns')}
                            >
                                Campaigns
                            </button>
                            <button 
                                className={`tab-button ${activeTab === 'video-generator' ? 'active' : ''}`}
                                onClick={() => setActiveTab('video-generator')}
                            >
                                Video Generator
                            </button>
                        </nav>

                        {activeTab === 'dashboard' && (
                            <Dashboard campaigns={campaigns} />
                        )}

                        {activeTab === 'campaigns' && (
                            <CampaignsTab 
                                campaigns={campaigns}
                                onAdd={() => setShowAddModal(true)}
                                onEdit={setEditingCampaign}
                                onDelete={deleteCampaign}
                            />
                        )}

                        {activeTab === 'video-generator' && (
                            <VideoGenerator campaigns={campaigns} />
                        )}

                        {(showAddModal || editingCampaign) && (
                            <CampaignModal
                                campaign={editingCampaign}
                                onSave={(campaign) => {
                                    if (editingCampaign) {
                                        updateCampaign({ ...campaign, id: editingCampaign.id });
                                        setEditingCampaign(null);
                                    } else {
                                        addCampaign(campaign);
                                        setShowAddModal(false);
                                    }
                                }}
                                onClose={() => {
                                    setShowAddModal(false);
                                    setEditingCampaign(null);
                                }}
                            />
                        )}

                        {toast && (
                            <div className="toast">
                                {toast}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Dashboard Component
        function Dashboard({ campaigns }) {
            const calculateStats = () => {
                if (campaigns.length === 0) {
                    return {
                        totalCampaigns: 0,
                        avgCTR: 0,
                        avgROAS: 0,
                        totalSpend: 0
                    };
                }

                const totalCTR = campaigns.reduce((sum, c) => sum + parseFloat(c.ctr || 0), 0);
                const totalROAS = campaigns.reduce((sum, c) => sum + parseFloat(c.roas || 0), 0);
                const totalSpend = campaigns.reduce((sum, c) => sum + parseFloat(c.adSpend || 0), 0);

                return {
                    totalCampaigns: campaigns.length,
                    avgCTR: (totalCTR / campaigns.length).toFixed(2),
                    avgROAS: (totalROAS / campaigns.length).toFixed(2),
                    totalSpend: totalSpend.toFixed(2)
                };
            };

            const stats = calculateStats();

            if (campaigns.length === 0) {
                return (
                    <div className="empty-state">
                        <div className="empty-state-icon">📊</div>
                        <h2>No campaigns yet</h2>
                        <p>Add your first campaign to start tracking metrics</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="stats-overview">
                        <div className="stat-card">
                            <div className="stat-title">Total Campaigns</div>
                            <div className="stat-value">{stats.totalCampaigns}</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-title">Avg CTR</div>
                            <div className="stat-value">{stats.avgCTR}%</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-title">Avg ROAS</div>
                            <div className="stat-value">{stats.avgROAS}x</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-title">Total Ad Spend</div>
                            <div className="stat-value">${stats.totalSpend}</div>
                        </div>
                    </div>

                    <div className="card">
                        <h2 style={{ marginBottom: '1.5rem' }}>Recent Campaigns</h2>
                        <div className="campaign-list">
                            {campaigns.slice(-5).reverse().map(campaign => (
                                <div key={campaign.id} className="campaign-item">
                                    <div className="campaign-header">
                                        <div>
                                            <div className="campaign-title">{campaign.campaignName}</div>
                                            <div className="campaign-brand">{campaign.brandName}</div>
                                        </div>
                                    </div>
                                    <div className="campaign-metrics">
                                        <div className="campaign-metric">
                                            <span className="campaign-metric-label">CTR</span>
                                            <span className="campaign-metric-value">{campaign.ctr}%</span>
                                        </div>
                                        <div className="campaign-metric">
                                            <span className="campaign-metric-label">Watch Time</span>
                                            <span className="campaign-metric-value">{campaign.watchTime}s</span>
                                        </div>
                                        <div className="campaign-metric">
                                            <span className="campaign-metric-label">ROAS</span>
                                            <span className="campaign-metric-value">{campaign.roas}x</span>
                                        </div>
                                        <div className="campaign-metric">
                                            <span className="campaign-metric-label">Cost/ATC</span>
                                            <span className="campaign-metric-value">${campaign.costPerATC}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Campaigns Tab Component
        function CampaignsTab({ campaigns, onAdd, onEdit, onDelete }) {
            if (campaigns.length === 0) {
                return (
                    <div className="card">
                        <div className="empty-state">
                            <div className="empty-state-icon">🎬</div>
                            <h2>No campaigns yet</h2>
                            <p>Start tracking your UGC campaign metrics</p>
                            <button className="btn" onClick={onAdd} style={{ marginTop: '1.5rem' }}>
                                Add First Campaign
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2rem' }}>
                        <h2>All Campaigns ({campaigns.length})</h2>
                        <button className="btn" onClick={onAdd}>+ Add Campaign</button>
                    </div>

                    <div className="campaign-list">
                        {campaigns.map(campaign => (
                            <div key={campaign.id} className="campaign-item">
                                <div className="campaign-header">
                                    <div>
                                        <div className="campaign-title">{campaign.campaignName}</div>
                                        <div className="campaign-brand">{campaign.brandName}</div>
                                    </div>
                                    <div className="campaign-actions">
                                        <button className="icon-btn" onClick={() => onEdit(campaign)}>✏️</button>
                                        <button className="icon-btn" onClick={() => {
                                            if (confirm('Delete this campaign?')) onDelete(campaign.id);
                                        }}>🗑️</button>
                                    </div>
                                </div>
                                <div className="campaign-metrics">
                                    <div className="campaign-metric">
                                        <span className="campaign-metric-label">CTR</span>
                                        <span className="campaign-metric-value">{campaign.ctr}%</span>
                                    </div>
                                    <div className="campaign-metric">
                                        <span className="campaign-metric-label">Watch Time</span>
                                        <span className="campaign-metric-value">{campaign.watchTime}s</span>
                                    </div>
                                    <div className="campaign-metric">
                                        <span className="campaign-metric-label">ROAS</span>
                                        <span className="campaign-metric-value">{campaign.roas}x</span>
                                    </div>
                                    <div className="campaign-metric">
                                        <span className="campaign-metric-label">Cost/ATC</span>
                                        <span className="campaign-metric-value">${campaign.costPerATC}</span>
                                    </div>
                                    {campaign.adSpend && (
                                        <div className="campaign-metric">
                                            <span className="campaign-metric-label">Ad Spend</span>
                                            <span className="campaign-metric-value">${campaign.adSpend}</span>
                                        </div>
                                    )}
                                </div>
                                {campaign.notes && (
                                    <div style={{ marginTop: '1rem', color: 'var(--text-secondary)', fontSize: '0.875rem' }}>
                                        {campaign.notes}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Campaign Modal Component
        function CampaignModal({ campaign, onSave, onClose }) {
            const [formData, setFormData] = useState(campaign || {
                brandName: '',
                campaignName: '',
                ctr: '',
                watchTime: '',
                roas: '',
                costPerATC: '',
                adSpend: '',
                notes: ''
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">
                                {campaign ? 'Edit Campaign' : 'Add Campaign'}
                            </h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>

                        <form onSubmit={handleSubmit}>
                            <div className="form-grid">
                                <div className="form-group">
                                    <label>Brand Name</label>
                                    <input
                                        type="text"
                                        value={formData.brandName}
                                        onChange={(e) => setFormData({...formData, brandName: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Campaign Name</label>
                                    <input
                                        type="text"
                                        value={formData.campaignName}
                                        onChange={(e) => setFormData({...formData, campaignName: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>CTR (%)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formData.ctr}
                                        onChange={(e) => setFormData({...formData, ctr: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Watch Time (sec)</label>
                                    <input
                                        type="number"
                                        step="0.1"
                                        value={formData.watchTime}
                                        onChange={(e) => setFormData({...formData, watchTime: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>ROAS (x)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formData.roas}
                                        onChange={(e) => setFormData({...formData, roas: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Cost per ATC ($)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formData.costPerATC}
                                        onChange={(e) => setFormData({...formData, costPerATC: e.target.value})}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Ad Spend ($)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        value={formData.adSpend}
                                        onChange={(e) => setFormData({...formData, adSpend: e.target.value})}
                                    />
                                </div>
                            </div>
                            
                            <div className="form-group" style={{ marginTop: '1rem' }}>
                                <label>Notes</label>
                                <textarea
                                    value={formData.notes}
                                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                                    placeholder="Add any additional insights or notes..."
                                />
                            </div>

                            <div style={{ display: 'flex', gap: '1rem', marginTop: '2rem' }}>
                                <button type="submit" className="btn" style={{ flex: 1 }}>
                                    {campaign ? 'Update Campaign' : 'Add Campaign'}
                                </button>
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Video Generator Component
        function VideoGenerator({ campaigns }) {
            const [selectedCampaign, setSelectedCampaign] = useState('');
            const [videoStyle, setVideoStyle] = useState('modern');
            const [generating, setGenerating] = useState(false);
            const [generatedVideo, setGeneratedVideo] = useState(null);
            const canvasRef = useRef(null);

            const campaign = campaigns.find(c => c.id === parseInt(selectedCampaign));

            const generateVideo = () => {
                if (!campaign) return;

                setGenerating(true);
                
                // Simulate video generation
                setTimeout(() => {
                    drawVideoFrame(campaign);
                    setGeneratedVideo(campaign);
                    setGenerating(false);
                }, 2000);
            };

            const drawVideoFrame = (campaign) => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const width = canvas.width = 1080;
                const height = canvas.height = 1920;

                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, '#0a0a0f');
                gradient.addColorStop(1, '#1a1a24');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // Add accent gradient
                const accentGradient = ctx.createRadialGradient(width/2, height/3, 0, width/2, height/3, width);
                accentGradient.addColorStop(0, 'rgba(0, 255, 136, 0.15)');
                accentGradient.addColorStop(1, 'transparent');
                ctx.fillStyle = accentGradient;
                ctx.fillRect(0, 0, width, height);

                // Title
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 80px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('UGC CASE STUDY', width/2, 200);

                // Brand name
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 60px Arial';
                ctx.fillText(campaign.brandName, width/2, 320);

                // Campaign name
                ctx.fillStyle = '#a0a0b8';
                ctx.font = '40px Arial';
                ctx.fillText(campaign.campaignName, width/2, 400);

                // Metrics
                const metrics = [
                    { label: 'CTR', value: `${campaign.ctr}%`, y: 600 },
                    { label: 'WATCH TIME', value: `${campaign.watchTime}s`, y: 800 },
                    { label: 'ROAS', value: `${campaign.roas}x`, y: 1000 },
                    { label: 'COST PER ATC', value: `$${campaign.costPerATC}`, y: 1200 }
                ];

                metrics.forEach(metric => {
                    // Label
                    ctx.fillStyle = '#606078';
                    ctx.font = 'bold 35px Arial';
                    ctx.fillText(metric.label, width/2, metric.y);
                    
                    // Value
                    ctx.fillStyle = '#00ff88';
                    ctx.font = 'bold 90px Arial';
                    ctx.fillText(metric.value, width/2, metric.y + 100);
                });

                // Footer
                ctx.fillStyle = '#606078';
                ctx.font = '35px Arial';
                ctx.fillText('UGC METRICS TRACKER', width/2, height - 150);
            };

            const downloadVideo = () => {
                const canvas = canvasRef.current;
                const link = document.createElement('a');
                link.download = `${campaign.campaignName.replace(/\s+/g, '-')}-case-study.png`;
                link.href = canvas.toDataURL();
                link.click();
            };

            const generateInsights = () => {
                if (!campaign) return [];

                const insights = [];
                
                const avgCTR = 2.5;
                const ctrDiff = ((campaign.ctr - avgCTR) / avgCTR * 100).toFixed(0);
                if (campaign.ctr > avgCTR) {
                    insights.push({
                        title: '🎯 High Click-Through Rate',
                        text: `This campaign's CTR is ${ctrDiff}% above industry average, showing strong creative hook.`
                    });
                }

                if (campaign.roas > 3) {
                    insights.push({
                        title: '💰 Excellent ROAS',
                        text: `With a ${campaign.roas}x ROAS, this campaign is highly profitable. Every $1 spent returns $${campaign.roas}.`
                    });
                }

                if (campaign.watchTime > 5) {
                    insights.push({
                        title: '👀 Strong Engagement',
                        text: `Average watch time of ${campaign.watchTime}s indicates compelling content that holds attention.`
                    });
                }

                if (campaign.costPerATC < 2) {
                    insights.push({
                        title: '🛒 Efficient Conversion',
                        text: `Cost per add-to-cart of $${campaign.costPerATC} shows efficient conversion funnel.`
                    });
                }

                return insights;
            };

            return (
                <div>
                    <div className="card">
                        <h2 style={{ marginBottom: '1.5rem' }}>Generate Case Study Video</h2>
                        
                        <div className="form-grid">
                            <div className="form-group">
                                <label>Select Campaign</label>
                                <select 
                                    value={selectedCampaign}
                                    onChange={(e) => setSelectedCampaign(e.target.value)}
                                >
                                    <option value="">Choose a campaign...</option>
                                    {campaigns.map(c => (
                                        <option key={c.id} value={c.id}>
                                            {c.brandName} - {c.campaignName}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label>Video Style</label>
                                <select 
                                    value={videoStyle}
                                    onChange={(e) => setVideoStyle(e.target.value)}
                                >
                                    <option value="modern">Modern Tech</option>
                                    <option value="minimal">Minimal Clean</option>
                                    <option value="bold">Bold & Vibrant</option>
                                </select>
                            </div>
                        </div>

                        <button 
                            className="btn" 
                            onClick={generateVideo}
                            disabled={!selectedCampaign || generating}
                            style={{ marginTop: '1rem', width: '100%' }}
                        >
                            {generating ? (
                                <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.5rem' }}>
                                    <span className="loading"></span> Generating Video...
                                </span>
                            ) : (
                                '🎬 Generate Video Frame'
                            )}
                        </button>

                        {campaign && generateInsights().length > 0 && (
                            <div style={{ marginTop: '2rem' }}>
                                <h3 style={{ marginBottom: '1rem' }}>Campaign Insights</h3>
                                {generateInsights().map((insight, i) => (
                                    <div key={i} className="insight-box">
                                        <div className="insight-title">{insight.title}</div>
                                        <div className="insight-text">{insight.text}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {generatedVideo && (
                        <div className="video-preview">
                            <h3 style={{ marginBottom: '1.5rem' }}>Preview (1080x1920 - Instagram Story Format)</h3>
                            <canvas ref={canvasRef} className="video-canvas"></canvas>
                            <div className="video-controls">
                                <button className="btn" onClick={downloadVideo}>
                                    📥 Download Frame
                                </button>
                                <button className="btn btn-secondary" onClick={generateVideo}>
                                    🔄 Regenerate
                                </button>
                            </div>
                            <p style={{ marginTop: '1rem', color: 'var(--text-muted)', fontSize: '0.875rem' }}>
                                💡 Tip: Use this frame as a thumbnail or create multiple frames for an animated video
                            </p>
                        </div>
                    )}

                    {campaigns.length === 0 && (
                        <div className="empty-state">
                            <div className="empty-state-icon">🎥</div>
                            <h2>No campaigns to generate from</h2>
                            <p>Add some campaigns first to create case study videos</p>
                        </div>
                    )}
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
